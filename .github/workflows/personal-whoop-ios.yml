name: WHOOP - personal iPhone IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Strand/**'
      - 'StrandTests/**'
      - 'StrandiOS/**'
      - 'StrandiOSShared/**'
      - 'StrandiOSWidgets/**'
      - 'Packages/**'
      - 'Config/**'
      - 'NOOPWatch*/**'
      - 'project.yml'
      - 'Tools/**'
      - '.github/workflows/personal-whoop-ios.yml'

permissions:
  contents: read

jobs:
  stress-regression:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: |
          python3 Tools/prepare_personal_whoop.py
          xcodegen generate --spec project.personal-whoop.generated.yml
      - name: Test selected-day stress and existing carry behavior
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild -project Strand.xcodeproj -scheme Strand -destination 'platform=macOS' -derivedDataPath build/stress-tests -only-testing:StrandTests/PersonalConnectionPresentationTests -only-testing:StrandTests/PersonalStressSummaryTests -only-testing:StrandTests/StressModelCarryTests CODE_SIGNING_ALLOWED=NO test 2>&1 | tee build/personal-stress-tests.log
      - name: Save stress test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WHOOP-stress-tests-${{ github.run_number }}
          path: build/personal-stress-tests.log
  ios:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Test personal resource branding
        run: |
          python3 Tools/test_personal_branding.py
          python3 Tools/test_personal_icon.py
      - name: Prepare requested personal app icon
        run: python3 Tools/prepare_personal_icon.py
      - name: Prepare personal identity
        run: python3 Tools/prepare_personal_whoop.py
      - name: Test analytics and presentation scales
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          swift test --package-path Packages/StrandAnalytics 2>&1 | tee build/personal-whoop-analytics-tests.log
          swift test --package-path Packages/StrandDesign 2>&1 | tee build/personal-whoop-design-tests.log
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate --spec project.personal-whoop.generated.yml
      - name: Build iPhone Release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild -project Strand.xcodeproj -scheme NOOPiOS \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath build/personal-whoop-dd \
            BUNDLE_ID_PREFIX=com.gabriel.whooppersonal \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build/personal-whoop-xcodebuild.log
      - name: Verify identity and prepare SideStore package
        shell: bash
        run: |
          set -euo pipefail
          APP="$PWD/build/personal-whoop-dd/Build/Products/Release-iphoneos/NOOP.app"
          test -d "$APP"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")" = com.gabriel.whooppersonal.noop
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP/Info.plist")" = WHOOP
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/PlugIns/NOOPWidgets.appex/Info.plist")" = com.gabriel.whooppersonal.noop.widgets
          test "$(/usr/libexec/PlistBuddy -c 'Print :AppGroupIdentifier' "$APP/Info.plist")" = group.com.gabriel.whooppersonal.noop.staging
          # The upstream sideload process excludes the embedded watch app.
          if [ -d "$APP/Watch" ]; then rm -rf "$APP/Watch"; fi
          bash Tools/prepare-ios-sideload-app.sh "$APP"
          mkdir -p build/personal-whoop-package/Payload
          ditto "$APP" build/personal-whoop-package/Payload/NOOP.app
          (cd build/personal-whoop-package && zip -qry ../WHOOP-ios.ipa Payload)
      - name: Save IPA and provenance
        uses: actions/upload-artifact@v4
        with:
          name: WHOOP-iPhone-${{ github.run_number }}
          path: |
            build/WHOOP-ios.ipa
            personal-whoop-build-manifest.generated.json
            build/personal-icon-provenance.json
          if-no-files-found: error
          retention-days: 14
      - name: Save build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WHOOP-build-log-${{ github.run_number }}
          path: |
            build/personal-whoop-xcodebuild.log
            build/personal-whoop-analytics-tests.log
            build/personal-whoop-design-tests.log
          if-no-files-found: ignore
          retention-days: 7
